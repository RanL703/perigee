[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "perigee"
version = "0.1.0"
description = "Satellite conjunction-risk triage assistant"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=0.3,<1",
    "sgp4>=2.24,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
perigee-screen = "perigee.cli:main"

[tool.fastapi]
entrypoint = "perigee.api.main:app"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
