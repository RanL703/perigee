services:
  postgres:
    image: postgres:16.4-alpine
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - perigee_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - perigee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-perigee}:${POSTGRES_PASSWORD:-perigee-local-dev}@postgres:5432/${POSTGRES_DB:-perigee}
      CELESTRAK_CATALOG_URL: ${CELESTRAK_CATALOG_URL:-https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=JSON}
      CELESTRAK_CACHE_PATH: /app/data/cache/celestrak_active.json
      OBJECT_LIMIT: ${OBJECT_LIMIT:-250}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-75}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - perigee_catalog_cache:/app/data/cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  perigee_postgres_data:
  perigee_redis_data:
  perigee_catalog_cache:
